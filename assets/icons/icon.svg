<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="pageGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="85%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="pageGradR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="15%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Ambient Glow Behind Book -->
  <ellipse cx="256" cy="270" rx="180" ry="90" fill="#6366f1" opacity="0.25" filter="url(#glow)" />

  <!-- Comic Book Outline & Pages -->
  <g transform="translate(0, 10)">
    <!-- Book Backing / Cover Shadow -->
    <path d="M 90 350 C 160 375, 230 365, 256 345 C 282 365, 352 375, 422 350 L 422 170 C 352 195, 282 185, 256 165 C 230 185, 160 195, 90 170 Z" fill="#0f172a" opacity="0.8" />
    
    <!-- Spine Rim -->
    <path d="M 256 165 L 256 348" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />

    <!-- Left Open Page -->
    <path d="M 96 338 C 160 360, 226 350, 252 334 L 252 154 C 226 170, 160 180, 96 158 Z" fill="url(#pageGradL)" />
    
    <!-- Left Page Panel Lines (Comic panels aesthetic) -->
    <rect x="116" y="180" width="54" height="60" rx="4" fill="#3b82f6" opacity="0.8" />
    <rect x="178" y="180" width="58" height="60" rx="4" fill="#6366f1" opacity="0.8" />
    <rect x="116" y="248" width="120" height="74" rx="4" fill="#8b5cf6" opacity="0.75" />

    <!-- Right Open Page (Curling Realistic Page) -->
    <path d="M 260 334 C 286 350, 352 360, 416 338 L 416 158 C 352 180, 286 170, 260 154 Z" fill="url(#pageGradR)" />

    <!-- Right Page Comic Panels -->
    <rect x="274" y="180" width="124" height="66" rx="4" fill="#ec4899" opacity="0.8" />
    <rect x="274" y="254" width="58" height="68" rx="4" fill="#f43f5e" opacity="0.8" />
    <rect x="340" y="254" width="58" height="68" rx="4" fill="#06b6d4" opacity="0.8" />

    <!-- Turning Page Dynamic Curl -->
    <path d="M 256 154 C 280 140, 340 148, 385 180 L 330 335 C 295 315, 270 318, 256 334 Z" fill="url(#accentGrad)" opacity="0.92" filter="url(#glow)" />
    <path d="M 385 180 L 330 335 C 310 325, 290 325, 270 330 L 320 185 Z" fill="#ffffff" opacity="0.35" />

    <!-- Bookmark Ribbon Hanging Down -->
    <path d="M 250 160 L 250 240 L 256 232 L 262 240 L 262 160 Z" fill="#ef4444" />
  </g>

  <!-- Title / Badge overlay -->
  <circle cx="400" cy="112" r="42" fill="url(#accentGrad)" />
  <polygon points="400,90 406,106 422,106 409,116 414,132 400,122 386,132 391,116 378,106 394,106" fill="#ffffff" />
</svg>
